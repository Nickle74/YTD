  if (v === null || v === undefined) return "#444";
  if (v > 0) {
    var t = Math.min(v / maxPos, 1);
    return "rgb(" + Math.round(15+(1-t)*40) + "," + Math.round(50+t*110) + "," + Math.round(15+(1-t)*40) + ")";
  }
  if (v < 0) {
    var t = Math.min(Math.abs(v) / maxNeg, 1);
    return "rgb(" + Math.round(100+t*155) + "," + Math.round(40*(1-t)) + "," + Math.round(40*(1-t)) + ")";
  }
  return "rgb(70,70,70)";
}

var canvas = document.getElementById("legendBar");
canvas.width = 260; canvas.height = 12;
var ctx = canvas.getContext("2d");
for (var x = 0; x < 260; x++) {
  var frac = x / 259;
  var val = -maxNeg + frac * (maxNeg + maxPos);
  ctx.fillStyle = vColor(val);
  ctx.fillRect(x, 0, 1, 12);
}

function fmt(n) { return n == null ? "N/A" : n.toLocaleString("en-US", {maximumFractionDigits: 0}); }
function fmtPct(v) { return v == null ? "N/A" : (v >= 0 ? "+" : "") + (v * 100).toFixed(1) + "%"; }
function clsStr(v) { return v == null ? "neu" : v > 0 ? "pos" : v < 0 ? "neg" : "neu"; }

var tooltip = document.getElementById("tooltip");

function getView() { return selView.value; }

function drawTreemap() {
  var view = getView();
  var sliderVal = parseInt(document.getElementById("sizeSlider").value);
  var width = 700, height = Math.round(sliderVal * 700 / 800);
  var groupMap = new Map();
  ALL_DATA.forEach(function(d) {
    var gk = view === "item" ? d.box : d.group;
    var bx = view === "item" ? d.group : d.box;
    if (!groupMap.has(gk)) groupMap.set(gk, []);
    groupMap.get(gk).push({group: gk, box: bx, ytd: d.ytd, pct: d.pct, chg: d.chg, cytd_ly: d.cytd_ly, acs: d.acs});
  });
  var hierData = { name: "Root", children: Array.from(groupMap, function(e) { return { name: e[0], children: e[1] }; }) };
  d3.select("#treemap").selectAll("*").remove();
  var svg = d3.select("#treemap").append("svg")
    .attr("viewBox", "0 0 " + width + " " + height)
    .attr("preserveAspectRatio", "xMidYMid meet")
    .style("width", "100%").style("height", "auto");
  var root = d3.hierarchy(hierData)
    .sum(function(d) { return d.ytd || 0; })
    .sort(function(a, b) { return b.value - a.value; });
  d3.treemap().size([width, height]).paddingTop(16).paddingInner(3).paddingOuter(2).round(true)(root);
  svg.selectAll(".sb").data(root.children).join("rect").attr("class", "sector-border")
    .attr("x", function(d){return d.x0;}).attr("y", function(d){return d.y0;})
    .attr("width", function(d){return d.x1-d.x0;}).attr("height", function(d){return d.y1-d.y0;});
  var leaves = svg.selectAll(".leaf").data(root.leaves()).join("g").attr("class", "leaf")
    .attr("transform", function(d) { return "translate(" + d.x0 + "," + d.y0 + ")"; });
  leaves.append("rect")
    .attr("width", function(d){return d.x1-d.x0;}).attr("height", function(d){return d.y1-d.y0;})
    .attr("rx", 2).attr("fill", function(d) { return vColor(d.data.pct); });

  function wrapText(g, label, cx, startY, maxW, fs) {
    var words = label.split(/\s+/);
    var lines = [], cur = "";
    var test = g.append("text").attr("font-size", fs+"px").style("visibility","hidden");
    words.forEach(function(w) {
      var try_ = cur ? cur + " " + w : w;
      test.text(try_);
      if (test.node().getComputedTextLength() > maxW - 4 && cur) {
        lines.push(cur); cur = w;
      } else { cur = try_; }
    });
    if (cur) lines.push(cur);
    test.remove();
    var lh = fs + 2;
    var totalH = lines.length * lh;
    var topY = startY - totalH / 2 + lh / 2;
    lines.forEach(function(ln, i) {
      g.append("text").attr("x", cx).attr("y", topY + i * lh)
        .attr("font-size", fs+"px").text(ln);
    });
    return lines.length;
  }

  leaves.each(function(d) {
    var w = d.x1-d.x0, h = d.y1-d.y0, g = d3.select(this), cx = w/2, cy = h/2;
    var fs = w>80&&h>28 ? 9 : w>45 ? 7 : 5.5;
    if (w > 20 && h > 14) {
      var lb = d.data.box;
      var nameY = h > 28 ? cy - 5 : cy;
      var nLines = wrapText(g, lb, cx, nameY, w, fs);
    }
    if (w > 25 && h > 28) {
      var p = d.data.pct;
      var t = p==null?"N/A":p===0?"0.0%":(p>0?"+":"")+(p*100).toFixed(1)+"%";
      var pctY = cy + (typeof nLines !== "undefined" && nLines > 1 ? nLines * 4 + 4 : 5);
      g.append("text").attr("x",cx).attr("y",pctY).attr("font-size",(w>80?8:6)+"px").attr("opacity",".88").text(t);
    }
  });

  function showTip(event, d) {
    var p = d.data.pct;
    var ps = p==null?"N/A":p===0?"0.0%":(p>0?"+":"")+(p*100).toFixed(1)+"%";
    var c = p==null?"neu":p>0?"pos":"neg";
    var chgC = clsStr(d.data.chg);
    tooltip.innerHTML = '<div class="tt-brand">'+d.data.box+'</div>'
      +'<div class="tt-sub">'+d.parent.data.name+'</div>'
      +'<div>YTD: <b>'+fmt(d.data.ytd)+'</b></div>'
      +'<div>CYTD LY: <b>'+fmt(d.data.cytd_ly)+'</b></div>'
      +'<div>Chg: <b class="'+chgC+'">'+fmt(d.data.chg)+'</b></div>'
      +'<div>% Chg: <b class="'+c+'">'+ps+'</b></div>'
      +'<div>ACS: <b>'+fmt(d.data.acs)+'</b></div>';
    tooltip.style.display = "block";
    var ex = event.touches ? event.touches[0] : event;
    tooltip.style.left = Math.min(ex.clientX+14, window.innerWidth-330)+"px";
    tooltip.style.top = Math.min(ex.clientY+14, window.innerHeight-100)+"px";
  }

  leaves.on("mousemove", showTip).on("mouseleave", function() { tooltip.style.display="none"; });
  leaves.on("touchstart", function(event, d) {
    event.preventDefault(); showTip(event, d);
    setTimeout(function() { tooltip.style.display="none"; }, 3000);
  });

  svg.selectAll(".sl").data(root.children).join("text").attr("class", "sector-label")
    .attr("x", function(d){return d.x0+5;}).attr("y", function(d){return d.y0+12;})
    .text(function(d){return d.data.name;})
    .each(function(d) {
      var mw = d.x1-d.x0-8;
      while (this.getComputedTextLength()>mw && this.textContent.length>3) this.textContent=this.textContent.slice(0,-4)+"\u2026";
    });

  buildTable();
}

function buildTable() {
  var view = getView();
  var container = document.getElementById("summary-table");
  if (ALL_DATA.length === 0) { container.innerHTML = ""; return; }
  var groups = new Map();
  ALL_DATA.forEach(function(d) {
    var gk = view === "item" ? d.box : d.group;
    var bx = view === "item" ? d.group : d.box;
    if (!groups.has(gk)) groups.set(gk, []);
    groups.get(gk).push({gk: gk, bx: bx, ytd: d.ytd, pct: d.pct, chg: d.chg, cytd_ly: d.cytd_ly, acs: d.acs});
  });
  var grpLabel = view === "item" ? "Item" : "Ownership";
  var subLabel = view === "item" ? "Ownership" : "Item";
  var html = '<h2>Summary Table</h2><div style="overflow-x:auto;"><table>';
  html += '<tr><th>'+grpLabel+'</th><th>'+subLabel+'</th><th class="right">YTD</th><th class="right">CYTD LY</th><th class="right">Chg</th><th class="right">% Chg</th><th class="right">ACS</th></tr>';
  var sortedGroups = Array.from(groups.entries()).sort(function(a,b) {
    var ta = 0, tb = 0; a[1].forEach(function(d){ta+=d.ytd;}); b[1].forEach(function(d){tb+=d.ytd;}); return tb - ta;
  });
  sortedGroups.forEach(function(entry) {
    var groupName = entry[0], items = entry[1];
    items.sort(function(a,b) { return b.ytd - a.ytd; });
    var grpYtd = 0, grpChg = 0, grpLy = 0;
    items.forEach(function(d) { grpYtd += d.ytd; grpChg += (d.chg||0); grpLy += (d.cytd_ly||0); });
    items.forEach(function(d, i) {
      var vc = clsStr(d.pct);
      var chgC = clsStr(d.chg);
      html += '<tr class="brand-row">';
      html += "<td>" + (i === 0 ? groupName : "") + "</td>";
      html += "<td>" + d.bx + "</td>";
      html += '<td class="right">' + fmt(d.ytd) + "</td>";
      html += '<td class="right">' + fmt(d.cytd_ly) + "</td>";
      html += '<td class="right ' + chgC + '">' + fmt(d.chg) + "</td>";
      html += '<td class="right ' + vc + '">' + fmtPct(d.pct) + "</td>";
      html += '<td class="right">' + fmt(d.acs) + "</td>";
      html += "</tr>";
    });
    var grpPct = grpLy > 0 ? (grpYtd - grpLy) / grpLy : null;
    html += '<tr class="subtotal">';
    html += "<td>" + groupName + " Total</td><td></td>";
    html += '<td class="right">' + fmt(grpYtd) + "</td>";
    html += '<td class="right">' + fmt(grpLy) + "</td>";
    html += '<td class="right ' + clsStr(grpChg) + '">' + fmt(grpChg) + "</td>";
    html += '<td class="right ' + clsStr(grpPct) + '">' + fmtPct(grpPct) + "</td>";
    html += "<td></td></tr>";
  });
  html += "</table></div>";
  container.innerHTML = html;
}

selView.addEventListener("change", drawTreemap);
var sizeSlider = document.getElementById("sizeSlider");
var sizeLabel = document.getElementById("sizeLabel");
sizeSlider.addEventListener("input", function() {
  sizeLabel.textContent = this.value + "px";
  drawTreemap();
});

drawTreemap();
</script>
</body>
</html>
