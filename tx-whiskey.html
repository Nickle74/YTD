var BRAND_IMAGES = {};

var selMetric = document.getElementById("metricSelect");
var selMarket = document.getElementById("marketSelect");
var selPeriod = document.getElementById("periodSelect");
var subtitleEl = document.getElementById("subtitleText");

function getMetric() {
  var m = selMetric.value;
  if (m === "dollars") return { dep: "dep_ns", rank: "rank_ns", pct: "pct_ns", label: "NS$", fmtVal: fmtDol };
  return { dep: "dep_9l", rank: "rank_9l", pct: "pct_9l", label: "9L", fmtVal: fmt };
}

function updateFilters() {
  var prevM = selMarket.value, prevP = selPeriod.value;
  var markets = []; ALL_DATA.forEach(function(d) { if (markets.indexOf(d.market)===-1) markets.push(d.market); });
  markets.sort();
  selMarket.innerHTML = "";
  markets.forEach(function(m) {
    var opt = document.createElement("option");
    opt.value = m; opt.textContent = m; if (m === prevM) opt.selected = true;
    selMarket.appendChild(opt);
  });
  var periods = []; ALL_DATA.forEach(function(d) { if (periods.indexOf(d.period)===-1) periods.push(d.period); });
  selPeriod.innerHTML = "";
  periods.forEach(function(p) {
    var opt = document.createElement("option");
    opt.value = p; opt.textContent = p; if (p === prevP) opt.selected = true;
    selPeriod.appendChild(opt);
  });
}

var maxPct = 0.30;
function vColor(v) {
  if (v === null || v === undefined) return "#444";
  var t = Math.min(Math.abs(v) / maxPct, 1);
  if (v > 0) return "rgb(" + Math.round(15+(1-t)*40) + "," + Math.round(50+t*110) + "," + Math.round(15+(1-t)*40) + ")";
  if (v < 0) return "rgb(" + Math.round(100+t*155) + "," + Math.round(40*(1-t)) + "," + Math.round(40*(1-t)) + ")";
  return "rgb(70,70,70)";
}

var canvas = document.getElementById("legendBar");
canvas.width = 260; canvas.height = 12;
var ctx = canvas.getContext("2d");
for (var x = 0; x < 260; x++) {
  ctx.fillStyle = vColor(-maxPct + (x / 259) * maxPct * 2);
  ctx.fillRect(x, 0, 1, 12);
}

function fmt(n) { return n == null ? "N/A" : n.toLocaleString("en-US", {maximumFractionDigits: 0}); }
function fmtDol(n) { return n == null ? "N/A" : "$" + n.toLocaleString("en-US", {maximumFractionDigits: 0}); }
function fmtPct(v) { return v == null ? "N/A" : (v >= 0 ? "+" : "") + (v * 100).toFixed(1) + "%"; }
function clsStr(v) { return v == null ? "neu" : v > 0 ? "pos" : v < 0 ? "neg" : "neu"; }

var tooltip = document.getElementById("tooltip");

function drawTreemap() {
  var mf = selMarket.value, pf = selPeriod.value;
  var met = getMetric();
  subtitleEl.textContent = "Box size = " + met.label + " | Color = YoY % change | Tap or hover for details";
  var filtered = ALL_DATA.filter(function(d) { return d.market === mf && d.period === pf; });
  filtered = filtered.filter(function(d) { return d[met.dep] > 0; });
  var sliderVal = parseInt(document.getElementById("sizeSlider").value);
  var width = 700, height = Math.round(sliderVal * 700 / 800);
  var groupMap = new Map();
  filtered.forEach(function(d) {
    if (!groupMap.has(d.group)) groupMap.set(d.group, []);
    groupMap.get(d.group).push(d);
  });
  var hierData = { name: "Root", children: Array.from(groupMap, function(e) { return { name: e[0], children: e[1] }; }) };
  d3.select("#treemap").selectAll("*").remove();
  var svg = d3.select("#treemap").append("svg")
    .attr("viewBox", "0 0 " + width + " " + height)
    .attr("preserveAspectRatio", "xMidYMid meet")
    .style("width", "100%").style("height", "auto");
  var root = d3.hierarchy(hierData)
    .sum(function(d) { return d[met.dep] || 0; })
    .sort(function(a, b) { return b.value - a.value; });
  d3.treemap().size([width, height]).paddingTop(16).paddingInner(3).paddingOuter(2).round(true)(root);
  svg.selectAll(".sb").data(root.children).join("rect").attr("class", "sector-border")
    .attr("x", function(d){return d.x0;}).attr("y", function(d){return d.y0;})
    .attr("width", function(d){return d.x1-d.x0;}).attr("height", function(d){return d.y1-d.y0;});
  var leaves = svg.selectAll(".leaf").data(root.leaves()).join("g").attr("class", "leaf")
    .attr("transform", function(d) { return "translate(" + d.x0 + "," + d.y0 + ")"; });
  leaves.append("rect")
    .attr("width", function(d){return d.x1-d.x0;}).attr("height", function(d){return d.y1-d.y0;})
    .attr("rx", 2).attr("fill", function(d) { return vColor(d.data[met.pct]); });

  function wrapText(g, label, cx, startY, maxW, fs) {
    var words = label.split(/\s+/);
    var lines = [], cur = "";
    var test = g.append("text").attr("font-size", fs+"px").style("visibility","hidden");
    words.forEach(function(w) {
      var try_ = cur ? cur + " " + w : w;
      test.text(try_);
      if (test.node().getComputedTextLength() > maxW - 4 && cur) {
        lines.push(cur); cur = w;
      } else { cur = try_; }
    });
    if (cur) lines.push(cur);
    test.remove();
    var lh = fs + 2;
    var totalH = lines.length * lh;
    var topY = startY - totalH / 2 + lh / 2;
    lines.forEach(function(ln, i) {
      g.append("text").attr("x", cx).attr("y", topY + i * lh)
        .attr("font-size", fs+"px").text(ln);
    });
    return lines.length;
  }

  leaves.each(function(d) {
    var w = d.x1-d.x0, h = d.y1-d.y0, g = d3.select(this), cx = w/2, cy = h/2;
    var depVal = d.data[met.dep];
    var pctVal = d.data[met.pct];
    var imgSrc = BRAND_IMAGES[d.data.group] || null;

    if (imgSrc && w > 50 && h > 45) {
      var imgSize = Math.min(Math.min(w, h) * 0.55, 50);
      var fs = w > 80 ? 7 : 5.5;
      var lh = fs + 2;
      var gap = 3;
      var totalH = imgSize + gap + lh + lh;
      var startY = Math.max(2, (h - totalH) / 2);
      g.append("image").attr("href", imgSrc)
        .attr("x", cx - imgSize/2).attr("y", startY)
        .attr("width", imgSize).attr("height", imgSize)
        .attr("preserveAspectRatio", "xMidYMid meet");
      var textTop = startY + imgSize + gap;
      var nLines = wrapText(g, d.data.box, cx, textTop + fs/2, w, fs);
      var nextY = textTop + nLines * lh + 1;
      if (nextY < h - 4) {
        var infoEl = g.append("text").attr("x",cx).attr("y",nextY).attr("font-size",(fs-0.5)+"px").attr("opacity",".8");
        infoEl.append("tspan").text(met.fmtVal(depVal));
        if (pctVal != null) {
          infoEl.append("tspan").text(", " + (pctVal >= 0 ? "+" : "") + (pctVal * 100).toFixed(1) + "%");
        }
      }
    } else {
      var fs2 = w>80&&h>28 ? 7.5 : w>45 ? 6 : 5;
      var lh2 = fs2 + 2;
      var numLines = 1;
      var contentH = lh2 + lh2;
      var blockTop = Math.max(2, (h - contentH) / 2);
      if (w > 20 && h > 14) {
        var nL = wrapText(g, d.data.box, cx, blockTop + fs2/2, w, fs2);
        numLines = nL;
      }
      if (w > 25 && h > 30) {
        var infoY = blockTop + numLines * lh2 + 1;
        var infoEl2 = g.append("text").attr("x",cx).attr("y",infoY).attr("font-size",(fs2-0.5)+"px").attr("opacity",".8");
        infoEl2.append("tspan").text(met.fmtVal(depVal));
        if (pctVal != null) {
          infoEl2.append("tspan").text(", " + (pctVal >= 0 ? "+" : "") + (pctVal * 100).toFixed(1) + "%");
        }
      }
    }
  });

  function showTip(event, d) {
    var met = getMetric();
    var depVal = d.data[met.dep];
    var pctVal = d.data[met.pct];
    var rankVal = d.data[met.rank];
    var ps = pctVal==null?"N/A":pctVal===0?"0.0%":(pctVal>0?"+":"")+(pctVal*100).toFixed(1)+"%";
    var c = clsStr(pctVal);
    var rk = rankVal ? "Rank #"+rankVal : "";
    tooltip.innerHTML = '<div class="tt-brand">'+d.data.box+'</div>'
      +'<div class="tt-sub">'+d.data.group+(rk?" \u00B7 "+rk:"")+'</div>'
      +'<div>9L Volume: <b>'+fmt(d.data.dep_9l)+'</b></div>'
      +'<div>9L Var%: <b class="'+clsStr(d.data.pct_9l)+'">'+fmtPct(d.data.pct_9l)+'</b></div>'
      +'<div>NS$: <b>'+fmtDol(d.data.dep_ns)+'</b></div>'
      +'<div>NS$ Var%: <b class="'+clsStr(d.data.pct_ns)+'">'+fmtPct(d.data.pct_ns)+'</b></div>';
    tooltip.style.display = "block";
    var ex2 = event.touches ? event.touches[0] : event;
    tooltip.style.left = Math.min(ex2.clientX+14, window.innerWidth-350)+"px";
    tooltip.style.top = Math.min(ex2.clientY+14, window.innerHeight-100)+"px";
  }

  leaves.on("mousemove", showTip).on("mouseleave", function() { tooltip.style.display="none"; });
  leaves.on("touchstart", function(event, d) {
    event.preventDefault(); showTip(event, d);
    setTimeout(function() { tooltip.style.display="none"; }, 3000);
  });

  svg.selectAll(".sl").data(root.children).join("text").attr("class", "sector-label")
    .attr("x", function(d){return d.x0+5;}).attr("y", function(d){return d.y0+12;})
    .text(function(d){return d.data.name;})
    .each(function(d) {
      var mw = d.x1-d.x0-8;
      while (this.getComputedTextLength()>mw && this.textContent.length>3) this.textContent=this.textContent.slice(0,-4)+"\u2026";
    });

  buildTable(filtered, met);
}

function buildTable(data, met) {
  var container = document.getElementById("summary-table");
  if (data.length === 0) { container.innerHTML = ""; return; }
  var groups = new Map();
  data.forEach(function(d) {
    if (!groups.has(d.group)) groups.set(d.group, []);
    groups.get(d.group).push(d);
  });
  var valLabel = met.label;
  var html = '<h2>Summary Table (' + valLabel + ')</h2><div style="overflow-x:auto;"><table>';
  html += '<tr><th>Brand Family</th><th>Item</th><th class="right">Rank</th><th class="right">' + valLabel + '</th><th class="right">Var%</th><th class="right">Share%</th></tr>';
  groups.forEach(function(items, groupName) {
    items.sort(function(a,b) { return (a[met.rank]||999) - (b[met.rank]||999); });
    var catTotal = 0;
    items.forEach(function(d) { catTotal += d[met.dep]; });
    items.forEach(function(d, i) {
      var share = catTotal > 0 ? (d[met.dep] / catTotal * 100).toFixed(1) + "%" : "N/A";
      var vc = clsStr(d[met.pct]);
      html += '<tr class="brand-row">';
      html += "<td>" + (i === 0 ? groupName : "") + "</td>";
      html += "<td>" + d.box + "</td>";
      html += '<td class="right">' + (d[met.rank] || "") + "</td>";
      html += '<td class="right">' + met.fmtVal(d[met.dep]) + "</td>";
      html += '<td class="right ' + vc + '">' + fmtPct(d[met.pct]) + "</td>";
      html += '<td class="right">' + share + "</td>";
      html += "</tr>";
    });
    html += '<tr class="subtotal">';
    html += "<td>" + groupName + " Total</td><td></td><td></td>";
    html += '<td class="right">' + met.fmtVal(catTotal) + "</td>";
    html += "<td></td>";
    html += '<td class="right">100.0%</td></tr>';
  });
  html += "</table></div>";
  container.innerHTML = html;
}

function refresh() { drawTreemap(); }
selMetric.addEventListener("change", refresh);
selMarket.addEventListener("change", refresh);
selPeriod.addEventListener("change", refresh);

var sizeSlider = document.getElementById("sizeSlider");
var sizeLabel = document.getElementById("sizeLabel");
sizeSlider.addEventListener("input", function() {
  sizeLabel.textContent = this.value + "px";
  drawTreemap();
});

updateFilters();
drawTreemap();
</script>
