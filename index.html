// ── Build hierarchy by Category ─────────────────────────────────
const catMap = new Map();
raw.forEach(d => {
  if (!catMap.has(d.cat)) catMap.set(d.cat, []);
  catMap.get(d.cat).push(d);
});

const data = {
  name: "Specs",
  children: Array.from(catMap, ([name, items]) => ({
    name,
    children: items
  }))
};

// ── Color scale: pure red ↔ pure green ──────────────────────────
const maxPct = 0.30;

function vColor(v) {
  if (v === null || v === undefined) return '#444';
  const t = Math.min(Math.abs(v) / maxPct, 1);
  if (v > 0) {
    const r = Math.round(28 + (1 - t) * 50);
    const g = Math.round(70 + t * 165);
    const b = Math.round(28 + (1 - t) * 50);
    return `rgb(${r},${g},${b})`;
  } else if (v < 0) {
    const r = Math.round(100 + t * 155);
    const g = Math.round(40 * (1 - t));
    const b = Math.round(40 * (1 - t));
    return `rgb(${r},${g},${b})`;
  } else {
    return 'rgb(70,70,70)';
  }
}

// ── Legend gradient ─────────────────────────────────────────────
const canvas = document.getElementById('legendBar');
canvas.width = 280; canvas.height = 14;
const ctx = canvas.getContext('2d');
for (let x = 0; x < 280; x++) {
  const v = -maxPct + (x / 279) * maxPct * 2;
  ctx.fillStyle = vColor(v);
  ctx.fillRect(x, 0, 1, 14);
}

// ── Treemap layout ──────────────────────────────────────────────
const width  = 700;
const height = 480;

const svg = d3.select('#treemap')
  .append('svg')
  .attr('viewBox', `0 0 ${width} ${height}`)
  .attr('preserveAspectRatio', 'xMidYMid meet')
  .style('width', '100%')
  .style('height', 'auto');

const root = d3.hierarchy(data)
  .sum(d => d.dep || 0)
  .sort((a, b) => b.value - a.value);

d3.treemap()
  .size([width, height])
  .paddingTop(16)
  .paddingInner(1.5)
  .paddingOuter(2)
  .round(true)(root);

// ── Sector headers ──────────────────────────────────────────────
const sectors = svg.selectAll('.sector')
  .data(root.children)
  .join('g');

sectors.append('rect')
  .attr('x', d => d.x0)
  .attr('y', d => d.y0)
  .attr('width', d => d.x1 - d.x0)
  .attr('height', d => d.y1 - d.y0)
  .attr('fill', 'none');

sectors.append('text')
  .attr('class', 'sector-label')
  .attr('x', d => d.x0 + 4)
  .attr('y', d => d.y0 + 11)
  .text(d => d.data.name)
  .each(function(d) {
    const maxW = d.x1 - d.x0 - 6;
    while (this.getComputedTextLength() > maxW && this.textContent.length > 3) {
      this.textContent = this.textContent.slice(0, -4) + '…';
    }
  });

// ── Leaf nodes ──────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');

const leaves = svg.selectAll('.leaf')
  .data(root.leaves())
  .join('g')
  .attr('class', 'leaf')
  .attr('transform', d => `translate(${d.x0},${d.y0})`);

leaves.append('rect')
  .attr('width',  d => d.x1 - d.x0)
  .attr('height', d => d.y1 - d.y0)
  .attr('rx', 2)
  .attr('fill', d => vColor(d.data.pct));

// Labels
leaves.each(function(d) {
  const w = d.x1 - d.x0;
  const h = d.y1 - d.y0;
  const g = d3.select(this);
  const cx = w / 2, cy = h / 2;

  if (w > 20 && h > 14) {
    const maxChars = Math.max(3, Math.floor(w / 5));
    let label = d.data.brand;
    if (label.length > maxChars) label = label.slice(0, maxChars - 1) + '…';
    const fs = w > 80 && h > 28 ? 9 : w > 45 ? 7 : 5.5;
    g.append('text').attr('class','lbl-name')
      .attr('x', cx).attr('y', h > 28 ? cy - 5 : cy)
      .attr('font-size', fs + 'px')
      .text(label);
  }
  if (w > 25 && h > 28) {
    const pct = d.data.pct;
    let txt = pct === 0 ? '0.0%' : (pct > 0 ? '+' : '') + (pct * 100).toFixed(1) + '%';
    const fs = w > 80 ? 8 : 6;
    g.append('text').attr('class','lbl-pct')
      .attr('x', cx).attr('y', cy + 5)
      .attr('font-size', fs + 'px')
      .attr('opacity', '.88')
      .text(txt);
  }
});

// ── Tooltip ─────────────────────────────────────────────────────
function fmt(n) { return n.toLocaleString('en-US', {maximumFractionDigits: 0}); }

leaves
  .on('mousemove', function(event, d) {
    const p = d.data.pct;
    const pctStr = p === 0 ? '0.0%' : (p > 0 ? '+' : '') + (p * 100).toFixed(1) + '%';
    const cls = p === 0 ? 'neu' : p > 0 ? 'pos' : 'neg';
    tooltip.innerHTML = `
      <div class="tt-brand">${d.data.brand}</div>
      <div class="tt-sub">${d.parent.data.name} · Rank #${d.data.rank}</div>
      <div>CYTD 9L Depl: <b>${fmt(d.data.dep)}</b></div>
      <div>% Change: <b class="${cls}">${pctStr}</b></div>
    `;
    tooltip.style.display = 'block';
    const tx = Math.min(event.clientX + 14, window.innerWidth - 310);
    const ty = Math.min(event.clientY + 14, window.innerHeight - 100);
    tooltip.style.left = tx + 'px';
    tooltip.style.top  = ty + 'px';
  })
  .on('mouseleave', () => { tooltip.style.display = 'none'; });
