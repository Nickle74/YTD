<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #141420; color: #fff; overflow-x: hidden; }
  h1 { text-align: center; padding: 18px 0 4px; font-size: 1.6rem; font-weight: 600; letter-spacing: .4px; color: #e0e0e0; }
  .subtitle { text-align: center; font-size: .95rem; color: #777; margin-bottom: 10px; }
  #treemap { width: 100%; margin: 0 auto; }
  .leaf rect { stroke: #141420; stroke-width: 1.5px; cursor: pointer; transition: opacity .12s; }
  .leaf:hover rect { opacity: .8; }
  .leaf text { fill: #fff; pointer-events: none; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
  .leaf .lbl-name { font-size: 10px; }
  .leaf .lbl-pct  { font-size: 9px; opacity: .88; }
  .sector-label { fill: #ccc; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .legend { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 10px auto 14px; font-size: .9rem; color: #999; }
  .legend-bar { width: 280px; height: 12px; border-radius: 6px; }
  #tooltip {
    position: fixed; pointer-events: none; display: none; z-index: 10;
    background: rgba(16,16,30,.94); border: 1px solid #555; border-radius: 8px;
    padding: 10px 14px; font-size: .8rem; line-height: 1.55; color: #ddd;
    backdrop-filter: blur(6px); max-width: 280px;
  }
  #tooltip .tt-brand { font-weight: 700; font-size: .95rem; color: #fff; }
  #tooltip .tt-sub   { color: #aaa; font-size: .72rem; margin-bottom: 4px; }
  #tooltip b.pos { color: #4caf50; }
  #tooltip b.neg { color: #ef5350; }
  #tooltip b.neu { color: #aaa; }

// ── Build hierarchy by Subclass ─────────────────────────────────
const subMap = new Map();
raw.forEach(d => {
  if (!subMap.has(d.sub)) subMap.set(d.sub, []);
  subMap.get(d.sub).push(d);
});

const data = {
  name: "Portfolio",
  children: Array.from(subMap, ([name, items]) => ({
    name,
    children: items.map(i => ({
      brand: i.brand,
      dep: i.dep,
      pct: i.pct          // null = no data
    }))
  }))
};

// ── Color scale ─────────────────────────────────────────────────
// Percentages are decimals: 0.10 = +10%. Scale caps at ±60% for intensity.
const maxPct = 0.60;

function vColor(v) {
  if (v === null || v === undefined) return '#444';       // grey = no data
  const t = Math.min(Math.abs(v) / maxPct, 1);
  if (v >= 0) {
    const r = Math.round(28  + (1 - t) * 50);
    const g = Math.round(70  + t * 165);
    const b = Math.round(28  + (1 - t) * 50);
    return `rgb(${r},${g},${b})`;
  } else {
    const r = Math.round(100 + t * 155);
    const g = Math.round(40  * (1 - t));
    const b = Math.round(40  * (1 - t));
    return `rgb(${r},${g},${b})`;
  }
}

// ── Legend gradient ─────────────────────────────────────────────
const canvas = document.getElementById('legendBar');
canvas.width = 280; canvas.height = 12;
const ctx = canvas.getContext('2d');
for (let x = 0; x < 280; x++) {
  const v = -maxPct + (x / 279) * maxPct * 2;
  ctx.fillStyle = vColor(v);
  ctx.fillRect(x, 0, 1, 12);
}

// ── Treemap layout ──────────────────────────────────────────────
const width  = 700;
const height = 480;

const svg = d3.select('#treemap')
  .append('svg')
  .attr('viewBox', `0 0 ${width} ${height}`)
  .attr('preserveAspectRatio', 'xMidYMid meet')
  .style('width', '100%')
  .style('height', 'auto');

const root = d3.hierarchy(data)
  .sum(d => d.dep || 0)
  .sort((a, b) => b.value - a.value);

d3.treemap()
  .size([width, height])
  .paddingTop(16)
  .paddingInner(1.5)
  .paddingOuter(2)
  .round(true)(root);

// ── Sector headers ──────────────────────────────────────────────
const sectors = svg.selectAll('.sector')
  .data(root.children)
  .join('g');

sectors.append('rect')
  .attr('x', d => d.x0)
  .attr('y', d => d.y0)
  .attr('width', d => d.x1 - d.x0)
  .attr('height', d => d.y1 - d.y0)
  .attr('fill', 'none');

sectors.append('text')
  .attr('class', 'sector-label')
  .attr('x', d => d.x0 + 5)
  .attr('y', d => d.y0 + 11)
  .text(d => d.data.name)
  .each(function(d) {
    const maxW = d.x1 - d.x0 - 8;
    while (this.getComputedTextLength() > maxW && this.textContent.length > 3) {
      this.textContent = this.textContent.slice(0, -4) + '…';
    }
  });

// ── Leaf nodes ──────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');

const leaves = svg.selectAll('.leaf')
  .data(root.leaves())
  .join('g')
  .attr('class', 'leaf')
  .attr('transform', d => `translate(${d.x0},${d.y0})`);

leaves.append('rect')
  .attr('width',  d => d.x1 - d.x0)
  .attr('height', d => d.y1 - d.y0)
  .attr('rx', 2)
  .attr('fill', d => vColor(d.data.pct));

// Labels
leaves.each(function(d) {
  const w = d.x1 - d.x0;
  const h = d.y1 - d.y0;
  const g = d3.select(this);
  const cx = w / 2, cy = h / 2;

  // Truncate brand name to fit
  if (w > 20 && h > 14) {
    const maxChars = Math.max(3, Math.floor(w / 5));
    let label = d.data.brand;
    if (label.length > maxChars) label = label.slice(0, maxChars - 1) + '…';
    const fs = w > 80 && h > 28 ? 9 : w > 45 ? 7 : 5.5;
    g.append('text').attr('class','lbl-name')
      .attr('x', cx).attr('y', h > 28 ? cy - 5 : cy)
      .attr('font-size', fs + 'px')
      .text(label);
  }
  if (w > 25 && h > 28) {
    const pct = d.data.pct;
    let txt = pct === null ? 'N/A' : (pct >= 0 ? '+' : '') + (pct * 100).toFixed(1) + '%';
    const fs = w > 80 ? 8 : 6;
    g.append('text').attr('class','lbl-pct')
      .attr('x', cx).attr('y', cy + 5)
      .attr('font-size', fs + 'px')
      .text(txt);
  }
});

// ── Tooltip ─────────────────────────────────────────────────────
function fmt(n) { return n.toLocaleString('en-US', {maximumFractionDigits: 0}); }

leaves
  .on('mousemove', function(event, d) {
    const p = d.data.pct;
    const pctStr = p === null ? 'N/A' : (p >= 0 ? '+' : '') + (p * 100).toFixed(1) + '%';
    const cls = p === null ? 'neu' : p >= 0 ? 'pos' : 'neg';
    tooltip.innerHTML = `
      <div class="tt-brand">${d.data.brand}</div>
      <div class="tt-sub">${d.parent.data.name}</div>
      <div>CYTD 9L Depl: <b>${fmt(d.data.dep)}</b></div>
      <div>% Change: <b class="${cls}">${pctStr}</b></div>
    `;
    tooltip.style.display = 'block';
    const tx = Math.min(event.clientX + 14, window.innerWidth - 290);
    const ty = Math.min(event.clientY + 14, window.innerHeight - 100);
    tooltip.style.left = tx + 'px';
    tooltip.style.top  = ty + 'px';
  })
  .on('mouseleave', () => { tooltip.style.display = 'none'; });
</script>
