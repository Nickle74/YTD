// ── Populate dropdown ───────────────────────────────────────────
const markets = [...new Set(ALL_DATA.map(d => d.market))].sort();
const sel = document.getElementById('marketSelect');

// Add "All Markets" option if there are multiple
if (markets.length > 1) {
  const opt = document.createElement('option');
  opt.value = '__ALL__';
  opt.textContent = 'All Markets';
  sel.appendChild(opt);
}
markets.forEach(m => {
  const opt = document.createElement('option');
  opt.value = m;
  opt.textContent = m;
  sel.appendChild(opt);
});

// ── Color scale ─────────────────────────────────────────────────
const maxPct = 0.30;

function vColor(v) {
  if (v === null || v === undefined) return '#444';
  const t = Math.min(Math.abs(v) / maxPct, 1);
  if (v > 0) {
    const r = Math.round(28 + (1 - t) * 50);
    const g = Math.round(70 + t * 165);
    const b = Math.round(28 + (1 - t) * 50);
    return `rgb(${r},${g},${b})`;
  } else if (v < 0) {
    const r = Math.round(100 + t * 155);
    const g = Math.round(40 * (1 - t));
    const b = Math.round(40 * (1 - t));
    return `rgb(${r},${g},${b})`;
  }
  return 'rgb(70,70,70)';
}

// Legend
const canvas = document.getElementById('legendBar');
canvas.width = 260; canvas.height = 12;
const ctx = canvas.getContext('2d');
for (let x = 0; x < 260; x++) {
  const v = -maxPct + (x / 259) * maxPct * 2;
  ctx.fillStyle = vColor(v);
  ctx.fillRect(x, 0, 1, 12);
}

// ── Draw treemap ────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');

function drawTreemap(marketFilter) {
  // Filter data
  let filtered = marketFilter === '__ALL__'
    ? ALL_DATA
    : ALL_DATA.filter(d => d.market === marketFilter);

  // If "All Markets", aggregate by cat+brand (sum dep, weighted avg pct)
  if (marketFilter === '__ALL__' && markets.length > 1) {
    const agg = new Map();
    filtered.forEach(d => {
      const key = d.cat + '|||' + d.brand;
      if (!agg.has(key)) {
        agg.set(key, { cat: d.cat, brand: d.brand, rank: d.rank, dep: 0, pctSum: 0, pctWeight: 0 });
      }
      const a = agg.get(key);
      a.dep += d.dep;
      if (d.pct !== null) {
        a.pctSum += d.pct * d.dep;
        a.pctWeight += d.dep;
      }
    });
    filtered = Array.from(agg.values()).map(a => ({
      cat: a.cat, brand: a.brand, rank: a.rank, dep: a.dep,
      pct: a.pctWeight > 0 ? a.pctSum / a.pctWeight : null
    }));
  }

  // Build hierarchy
  const catMap = new Map();
  filtered.forEach(d => {
    if (!catMap.has(d.cat)) catMap.set(d.cat, []);
    catMap.get(d.cat).push(d);
  });

  const hierData = {
    name: "Root",
    children: Array.from(catMap, ([name, items]) => ({ name, children: items }))
  };

  // Clear previous
  d3.select('#treemap').selectAll('*').remove();

  const width = 700;
  const height = 480;

  const svg = d3.select('#treemap')
    .append('svg')
    .attr('viewBox', `0 0 ${width} ${height}`)
    .attr('preserveAspectRatio', 'xMidYMid meet')
    .style('width', '100%')
    .style('height', 'auto');

  const root = d3.hierarchy(hierData)
    .sum(d => d.dep || 0)
    .sort((a, b) => b.value - a.value);

  d3.treemap()
    .size([width, height])
    .paddingTop(16)
    .paddingInner(1.5)
    .paddingOuter(2)
    .round(true)(root);

  // Sector headers
  const sectors = svg.selectAll('.sector')
    .data(root.children)
    .join('g');

  sectors.append('rect')
    .attr('x', d => d.x0).attr('y', d => d.y0)
    .attr('width', d => d.x1 - d.x0).attr('height', d => d.y1 - d.y0)
    .attr('fill', 'none');

  sectors.append('text')
    .attr('class', 'sector-label')
    .attr('x', d => d.x0 + 4).attr('y', d => d.y0 + 11)
    .text(d => d.data.name)
    .each(function(d) {
      const maxW = d.x1 - d.x0 - 6;
      while (this.getComputedTextLength() > maxW && this.textContent.length > 3)
        this.textContent = this.textContent.slice(0, -4) + '\u2026';
    });

  // Leaves
  const leaves = svg.selectAll('.leaf')
    .data(root.leaves())
    .join('g')
    .attr('class', 'leaf')
    .attr('transform', d => `translate(${d.x0},${d.y0})`);

  leaves.append('rect')
    .attr('width', d => d.x1 - d.x0).attr('height', d => d.y1 - d.y0)
    .attr('rx', 2)
    .attr('fill', d => vColor(d.data.pct));

  // Labels
  leaves.each(function(d) {
    const w = d.x1 - d.x0, h = d.y1 - d.y0;
    const g = d3.select(this);
    const cx = w / 2, cy = h / 2;

    if (w > 20 && h > 14) {
      const maxChars = Math.max(3, Math.floor(w / 5));
      let label = d.data.brand;
      if (label.length > maxChars) label = label.slice(0, maxChars - 1) + '\u2026';
      const fs = w > 80 && h > 28 ? 9 : w > 45 ? 7 : 5.5;
      g.append('text').attr('class', 'lbl-name')
        .attr('x', cx).attr('y', h > 28 ? cy - 5 : cy)
        .attr('font-size', fs + 'px').text(label);
    }
    if (w > 25 && h > 28) {
      const pct = d.data.pct;
      let txt = pct === null ? 'N/A' : pct === 0 ? '0.0%' : (pct > 0 ? '+' : '') + (pct * 100).toFixed(1) + '%';
      const fs = w > 80 ? 8 : 6;
      g.append('text').attr('class', 'lbl-pct')
        .attr('x', cx).attr('y', cy + 5)
        .attr('font-size', fs + 'px').attr('opacity', '.88').text(txt);
    }
  });

  // Tooltip
  function fmt(n) { return n.toLocaleString('en-US', {maximumFractionDigits: 0}); }

  leaves
    .on('mousemove', function(event, d) {
      const p = d.data.pct;
      const pctStr = p === null ? 'N/A' : p === 0 ? '0.0%' : (p > 0 ? '+' : '') + (p * 100).toFixed(1) + '%';
      const cls = p === null ? 'neu' : p > 0 ? 'pos' : 'neg';
      const rankStr = d.data.rank ? `Rank #${d.data.rank}` : '';
      tooltip.innerHTML = `
        <div class="tt-brand">$${d.data.brand}</div>
        <div class="tt-sub">$${d.parent.data.name}${rankStr ? ' \u00B7 ' + rankStr : ''}</div>
        <div>CYTD 9L Depl: <b>$${fmt(d.data.dep)}</b></div>
        <div>% Change: <b class="$${cls}">$${pctStr}</b></div>
      `;
      tooltip.style.display = 'block';
      tooltip.style.left = Math.min(event.clientX + 14, window.innerWidth - 310) + 'px';
      tooltip.style.top = Math.min(event.clientY + 14, window.innerHeight - 100) + 'px';
    })
    .on('mouseleave', () => { tooltip.style.display = 'none'; });
}

// ── Init ────────────────────────────────────────────────────────
sel.addEventListener('change', () => drawTreemap(sel.value));
drawTreemap(sel.value);
</script>
