// Populate dropdown
var selSite = document.getElementById('siteSelect');
var sites = [];
ALL_DATA.forEach(function(d) {
  if (sites.indexOf(d.site) === -1) sites.push(d.site);
});
sites.sort();
sites.forEach(function(s) {
  var opt = document.createElement('option');
  opt.value = s;
  opt.textContent = s;
  selSite.appendChild(opt);
});

// Color scale
var maxPct = 0.30;
function vColor(v) {
  if (v === null || v === undefined) return '#444';
  var t = Math.min(Math.abs(v) / maxPct, 1);
  if (v > 0) {
    return 'rgb(' + Math.round(28+(1-t)*50) + ',' + Math.round(70+t*165) + ',' + Math.round(28+(1-t)*50) + ')';
  } else if (v < 0) {
    return 'rgb(' + Math.round(100+t*155) + ',' + Math.round(40*(1-t)) + ',' + Math.round(40*(1-t)) + ')';
  }
  return 'rgb(70,70,70)';
}

var canvas = document.getElementById('legendBar');
canvas.width = 260; canvas.height = 12;
var ctx = canvas.getContext('2d');
for (var x = 0; x < 260; x++) {
  var v = -maxPct + (x / 259) * maxPct * 2;
  ctx.fillStyle = vColor(v);
  ctx.fillRect(x, 0, 1, 12);
}

// Helpers
function fmt(n) { return n == null ? 'N/A' : n.toLocaleString('en-US', {maximumFractionDigits: 0}); }
function fmt1(n) { return n == null ? 'N/A' : n.toLocaleString('en-US', {minimumFractionDigits: 1, maximumFractionDigits: 1}); }
function fmt2(n) { return n == null ? 'N/A' : n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2}); }
function fmtPct(v) { return v == null ? 'N/A' : (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%'; }
function fmtVar(v) { return v == null ? 'N/A' : (v >= 0 ? '+' : '') + fmt1(v); }
function cls(v) { return v == null ? 'neu' : v > 0 ? 'pos' : v < 0 ? 'neg' : 'neu'; }

function metricRow(label, val, varVal, varPct, valFmt) {
  return '<tr>' +
    '<td>' + label + '</td>' +
    '<td class="val">' + valFmt + '</td>' +
    '<td class="var ' + cls(varVal) + '">' + fmtVar(varVal) + '</td>' +
    '<td class="varp ' + cls(varPct) + '">' + fmtPct(varPct) + '</td>' +
    '</tr>';
}

// Draw treemap
var tooltip = document.getElementById('tooltip');

function drawTreemap() {
  var siteFilter = selSite.value;
  var filtered = ALL_DATA.filter(function(d) { return d.site === siteFilter; });

  var sliderVal = parseInt(document.getElementById('sizeSlider').value);
  var width = 700;
  var height = Math.round(sliderVal * 700 / 800);

  // Group by OnOff Premises
  var groupMap = new Map();
  filtered.forEach(function(d) {
    if (!groupMap.has(d.onoff)) groupMap.set(d.onoff, []);
    groupMap.get(d.onoff).push(d);
  });

  var hierData = {
    name: "Root",
    children: Array.from(groupMap, function(entry) { return { name: entry[0], children: entry[1] }; })
  };

  d3.select('#treemap').selectAll('*').remove();

  var svg = d3.select('#treemap')
    .append('svg')
    .attr('viewBox', '0 0 ' + width + ' ' + height)
    .attr('preserveAspectRatio', 'xMidYMid meet')
    .style('width', '100%')
    .style('height', 'auto');

  var root = d3.hierarchy(hierData)
    .sum(function(d) { return d.dep || 0; })
    .sort(function(a, b) { return b.value - a.value; });

  d3.treemap()
    .size([width, height])
    .paddingTop(16)
    .paddingInner(3)
    .paddingOuter(2)
    .round(true)(root);

  // Sector borders
  svg.selectAll('.sector-border-rect')
    .data(root.children)
    .join('rect')
    .attr('class', 'sector-border')
    .attr('x', function(d) { return d.x0; }).attr('y', function(d) { return d.y0; })
    .attr('width', function(d) { return d.x1 - d.x0; }).attr('height', function(d) { return d.y1 - d.y0; });

  // Leaves
  var leaves = svg.selectAll('.leaf')
    .data(root.leaves())
    .join('g')
    .attr('class', 'leaf')
    .attr('transform', function(d) { return 'translate(' + d.x0 + ',' + d.y0 + ')'; });

  leaves.append('rect')
    .attr('width', function(d) { return d.x1 - d.x0; })
    .attr('height', function(d) { return d.y1 - d.y0; })
    .attr('rx', 2)
    .attr('fill', function(d) { return vColor(d.data.pct); });

  // Labels
  leaves.each(function(d) {
    var w = d.x1 - d.x0, h = d.y1 - d.y0;
    var g = d3.select(this);
    var cx = w / 2, cy = h / 2;

    if (w > 20 && h > 14) {
      var maxChars = Math.max(3, Math.floor(w / 5));
      var label = d.data.item;
      if (label.length > maxChars) label = label.slice(0, maxChars - 1) + '…';
      var fs = w > 80 && h > 28 ? 9 : w > 45 ? 7 : 5.5;
      g.append('text')
        .attr('x', cx).attr('y', h > 28 ? cy - 5 : cy)
        .attr('font-size', fs + 'px').text(label);
    }
    if (w > 25 && h > 28) {
      var pct = d.data.pct;
      var txt = pct == null ? 'N/A' : pct === 0 ? '0.0%' : (pct > 0 ? '+' : '') + (pct * 100).toFixed(1) + '%';
      var fs2 = w > 80 ? 8 : 6;
      g.append('text')
        .attr('x', cx).attr('y', cy + 5)
        .attr('font-size', fs2 + 'px').attr('opacity', '.88').text(txt);
    }
  });

  // Rich tooltip
  leaves
    .on('mousemove', function(event, d) {
      var dd = d.data;
      tooltip.innerHTML =
        '<div class="tt-name">' + dd.item + '</div>' +
        '<div class="tt-premise">' + d.parent.data.name + '</div>' +
        '<table>' +
        '<tr><th></th><th style="text-align:right">Value</th><th style="text-align:right">Var</th><th style="text-align:right">Var%</th></tr>' +
        metricRow('9L Cases', dd.dep, dd.v9l, dd.pct, fmt(dd.dep)) +
        metricRow('ACS', dd.acs, dd.vacs, dd.pacs, fmt(dd.acs)) +
        metricRow('RoS', dd.ros, dd.vros, dd.pros, fmt2(dd.ros)) +
        metricRow('#Purchases', dd.purch, dd.vpurch, dd.ppurch, fmt(dd.purch)) +
        metricRow('#Mo. Purch', dd.months, dd.vmonths, dd.pmonths, fmt(dd.months)) +
        '</table>';
      tooltip.style.display = 'block';
      tooltip.style.left = Math.min(event.clientX + 14, window.innerWidth - 370) + 'px';
      tooltip.style.top = Math.min(event.clientY + 14, window.innerHeight - 200) + 'px';
    })
    .on('mouseleave', function() { tooltip.style.display = 'none'; });

  // Sector labels (on top)
  svg.selectAll('.sector-label-text')
    .data(root.children)
    .join('text')
    .attr('class', 'sector-label')
    .attr('x', function(d) { return d.x0 + 5; }).attr('y', function(d) { return d.y0 + 12; })
    .text(function(d) { return d.data.name; })
    .each(function(d) {
      var maxW = d.x1 - d.x0 - 8;
      while (this.getComputedTextLength() > maxW && this.textContent.length > 3)
        this.textContent = this.textContent.slice(0, -4) + '…';
    });
}

// Init
selSite.addEventListener('change', drawTreemap);

var sizeSlider = document.getElementById('sizeSlider');
var sizeLabel = document.getElementById('sizeLabel');
sizeSlider.addEventListener('input', function() {
  sizeLabel.textContent = this.value + 'px';
  drawTreemap();
});

drawTreemap();
</script>
</body>
